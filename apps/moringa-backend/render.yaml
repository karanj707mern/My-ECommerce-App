services:
  - type: web
    name: moringa-backend
    env: node
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: moringa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: moringa-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: moringa-db
    plan: starter
