# =============================================================================
# Moringa Backend — standalone container run (backend ONLY)
#
# The frontend is NOT part of this stack: it deploys to Vercel from source.
# PostgreSQL / Redis / RabbitMQ are NOT defined here either: they live on
# cloud providers in deployment and natively on developer machines locally.
#
# Usage:
#   # Local (uses native postgres/redis/rabbitmq on the Docker host):
#   docker compose up --build
#
#   # Against cloud services:
#   DATABASE_URL=... REDIS_URL=... RABBITMQ_URL=... docker compose up
#
# Build context MUST be the repository root (workspace lockfile lives there).
# =============================================================================

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/moringa-backend/Dockerfile
    image: moringa-backend:local
    container_name: moringa-backend
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://moringa:moringa@host.docker.internal:5432/moringa}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@host.docker.internal:5672/}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-minimum-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
