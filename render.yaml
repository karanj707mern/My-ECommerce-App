# =============================================================================
# Moringa Backend — Render Blueprint (backend ONLY)
#
# Deployment topology:
#   - Backend API  : this web service (Docker, apps/moringa-backend/Dockerfile)
#   - Frontend     : deployed separately on Vercel (NOT managed here)
#   - PostgreSQL   : Render-managed database (defined below)
#   - Redis        : external cloud provider (Upstash/Redis Cloud) -> REDIS_URL
#   - RabbitMQ     : external cloud broker (CloudAMQP)          -> RABBITMQ_URL
#
# Place this file at the repository ROOT. Render resolves dockerfilePath /
# dockerContext relative to this file; the Dockerfile requires the repo-root
# context because the npm workspace lockfile lives there.
# =============================================================================

services:
  - type: web
    name: moringa-backend
    runtime: docker
    dockerfilePath: ./apps/moringa-backend/Dockerfile
    dockerContext: ./
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; main.ts listens on it (default 5000 locally).
      - key: DATABASE_URL
        fromDatabase:
          name: moringa-db
          property: connectionString
      # External cloud services — set real connection strings in the dashboard
      # after the first blueprint sync (they start empty by design).
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      # Secrets rotated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      # Public origin of the Vercel frontend (CORS + cookies + links).
      - key: FRONTEND_URL
        sync: false
      # Payment gateway credentials (set in dashboard).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    # Persistent volume for locally-stored uploads (STORAGE_PROVIDER=local).
    disks:
      - name: moringa-uploads
        mountPath: /app/uploads
        sizeGB: 1

databases:
  - name: moringa-db
    plan: basic-256mb
    databaseName: moringa
    user: moringa
